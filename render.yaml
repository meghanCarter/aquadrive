# $0 service + external Turso free-tier storage. Supply secrets in Render only.
# Do not apply until existing records are backed up/migrated and the database is tested.
services:
  - type: web
    name: aquadrive-demo
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: cd aquadrive && npm ci && npm run lint && npm run typecheck && EXPO_OFFLINE=1 npx expo export --platform web --output-dir ../server/public && cd ../server && npm ci --omit=dev && npm test
    startCommand: cd server && node index.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: REQUIRE_DURABLE_STORAGE
        value: "true"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: CURRENCY
        value: USD
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: PUBLIC_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
